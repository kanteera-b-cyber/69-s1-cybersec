services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=123456
      - POSTGRES_USER=kanteera
      - POSTGRES_DB=kanteera
    volumes:
      - data-postgres:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4:8.8
    container_name: 69-s2-admin
    ports:
      - ${PGADMIN_DEFAULT_PORT}:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=kanteera-b@rmutp.ac.th
      - PGADMIN_DEFAULT_PASSWORD=123456
    volumes:
      - data-pgadmin:/var/lib/pgadmin
    depends_on:
      - db
      
  app:
    image: prawee/strapi
    container_name: 69-s2-app
    restart: always
    depends_on:
      - db
    ports:
      - ${APP_PORT}:1337
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: kanteera
      DATABASE_USERNAME: kanteera
      DATABASE_PASSWORD: 123456

volumes:
  data-postgres: